<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Beach Volley</title>
    <!-- Stile minimalista scuro in linea con il Glassmorphism base -->
    <style>
        .bv-widget-container {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(102, 252, 241, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            margin: 0 auto;
        }
        .bv-title {
            color: #fff;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .bv-live-badge {
            background-color: #ff652f;
            color: #0b0c10;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .bv-subtitle {
            color: #66fcf1;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .bv-match {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #66fcf1;
        }
        .bv-match.finished {
            border-left-color: #c5c6c7;
            opacity: 0.7;
        }
        .bv-team {
            flex: 1;
            font-weight: 600;
        }
        .bv-team.team2 {
            text-align: right;
        }
        .bv-score {
            font-family: monospace;
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
            padding: 0 15px;
        }
        .bv-time {
            font-size: 0.75rem;
            color: #ff652f;
            text-align: center;
            width: 100%;
            margin-top: 5px;
        }
        .bv-standings {
            margin-top: 20px;
            border-collapse: collapse;
            width: 100%;
        }
        .bv-standings th, .bv-standings td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bv-standings th {
            color: #66fcf1;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .bv-standings td {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- CONTAINER WIDGET -->
    <div id="beach-volley-widget" class="bv-widget-container">
        <h2 class="bv-title">
            <span id="bv-tour-name">Caricamento Torneo...</span>
            <span class="bv-live-badge">Live</span>
        </h2>
        <div id="bv-tour-status" class="bv-subtitle">In attesa dei dati da Firebase...</div>

        <h3>Ultime Partite</h3>
        <div id="bv-matches-container">
            <!-- Partite iniettate via JS -->
        </div>

        <h3 style="margin-top: 20px;">Classifiche Gironi</h3>
        <div id="bv-standings-container">
             <!-- Classifiche iniettate via JS -->
        </div>
    </div>

    <!-- SCRIPT FIREBASE COMPAT (Modulo ES) -->
    <script type="module">
        // Importa Firebase SDK via CDN per l'uso standalone nei browser
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Configurazione - ISTRUZIONI PER L'UTENTE FINALE:
        // 1. Sostituisci i dati con la config del tuo progetto Firebase
        // 2. Inserisci la API_KEY generata nella Dashboard Admin
        const firebaseConfig = {
            apiKey: "TUA_FIREBASE_API_KEY",
            authDomain: "TUA_APP.firebaseapp.com",
            projectId: "TUA_APP",
        };
        const TOURNAMENT_API_KEY = "CHIAVE_GENERATA_DALL_ADMIN_UI";

        // Inizializza Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tourNameEl = document.getElementById('bv-tour-name');
        const tourStatusEl = document.getElementById('bv-tour-status');
        const matchesContainer = document.getElementById('bv-matches-container');
        const standingsContainer = document.getElementById('bv-standings-container');

        // Ascolta le modifiche in tempo reale sulla collezione pubblica
        const unsub = onSnapshot(doc(db, "public_tournaments", TOURNAMENT_API_KEY), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                tourNameEl.textContent = data.name;
                tourStatusEl.textContent = data.isArchived ? "Archiviato" : "In corso";

                // Renderizza Partite (mostriamo le ultime 5 o live)
                matchesContainer.innerHTML = '';
                if(data.matches && data.matches.length > 0) {
                    // Ordina mettendo prima quelle non finite, poi per id/time
                    const sortedMatches = [...data.matches].sort((a, b) => (a.isFinished === b.isFinished) ? 0 : a.isFinished ? 1 : -1).slice(0, 5);

                    sortedMatches.forEach(match => {
                        let t1Name = "TBD";
                        let t2Name = "TBD";
                        let groupName = "";

                        // Trova nomi dei team
                        if(match.groupId) {
                            const group = data.groups.find(g => g.id === match.groupId);
                            if(group) {
                                groupName = `(${group.name}) `;
                                const t1 = group.teams.find(t => t.id === match.team1Id);
                                const t2 = group.teams.find(t => t.id === match.team2Id);
                                if(t1) t1Name = t1.name;
                                if(t2) t2Name = t2.name;
                            }
                        } else {
                            // Fase Finale - da implementare mappatura avanzata
                            groupName = `(${match.phaseType}) `;
                        }

                        if(match.team1Id === 'dummy_bye' || match.team2Id === 'dummy_bye') return; // Salta i bye
                        if(match.team1Id === 'dummy' || match.team2Id === 'dummy') return;

                        const matchEl = document.createElement('div');
                        matchEl.className = `bv-match ${match.isFinished ? 'finished' : ''}`;
                        matchEl.innerHTML = `
                            <div style="width: 100%; display: flex; flex-direction: column;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div class="bv-team">${t1Name}</div>
                                    <div class="bv-score">${match.team1Score[0] || 0} - ${match.team2Score[0] || 0}</div>
                                    <div class="bv-team team2">${t2Name}</div>
                                </div>
                                ${match.scheduledTime ? `<div class="bv-time">${groupName} ${match.scheduledTime}</div>` : `<div class="bv-time">${groupName}</div>`}
                            </div>
                        `;
                        matchesContainer.appendChild(matchEl);
                    });
                } else {
                    matchesContainer.innerHTML = '<p style="font-size:0.9rem;">Nessuna partita al momento.</p>';
                }

                // Renderizza Classifiche
                standingsContainer.innerHTML = '';
                if(data.groups && data.groups.length > 0) {
                    data.groups.forEach(group => {
                        const table = document.createElement('table');
                        table.className = 'bv-standings';

                        // Header
                        table.innerHTML = `
                            <thead>
                                <tr>
                                    <th>${group.name}</th>
                                    <th>Pt</th>
                                    <th>W-L</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        `;

                        const tbody = table.querySelector('tbody');

                        // Ordina i team (già ordinati dal backend idealmente, ma riordiniamo per punti)
                        const sortedTeams = [...group.teams].sort((a,b) => b.points - a.points);

                        sortedTeams.forEach(team => {
                            if(team.id === 'dummy') return;
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${team.name}</td>
                                <td><strong>${team.points}</strong></td>
                                <td>${team.setsWon}-${team.setsLost}</td>
                            `;
                            tbody.appendChild(tr);
                        });

                        standingsContainer.appendChild(table);
                    });
                }

            } else {
                tourStatusEl.textContent = "Errore: Torneo non trovato. Verifica la API KEY.";
            }
        });
    </script>
</body>
</html>
